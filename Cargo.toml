[package]
name = "applicationlauncher"
version = "0.3.4"
edition = "2024"

[dependencies]
eframe = "0.33.0"
egui_extras = { version = "0.33.0", default-features = false, features = ["file", "image", "svg"] }
image = { version = "0.25.5", default-features = false, features = ["png", "jpeg"] }
freedesktop-icons = "0.4.0"
pollster = "0.4.0"
rustix = { version = "1.1.4", features = ["process"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
fuzzy-rank = { path = "../fuzzy-rank" }
zbus = "5.16.0"
rusqlite = { version = "0.37.0", features = ["bundled"] }
signal-hook = "0.3.18"
libc = "0.2.174"

# Keep routine checks and tests compact. Full production DWARF remains enabled
# in the release profile and is preserved by build-debuggable-release.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.test.package."*"]
debug = 0

[profile.release]
debug = 2
split-debuginfo = "off"
strip = "none"
panic = "unwind"
