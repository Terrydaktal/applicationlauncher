[package]
name = "tracing"
version = "0.1.44"
edition = "2021"
license = "MIT"
description = "Build-time observer erasure adapter for Applicationlauncher's pinned Linux release-minimal dependency closure"

[features]
default = ["std", "attributes"]
std = []
attributes = ["dep:erased-tracing-attributes"]
async-await = []
log = []
log-always = []
valuable = []
max_level_off = []
max_level_error = []
max_level_warn = []
max_level_info = []
max_level_debug = []
max_level_trace = []
release_max_level_off = []
release_max_level_error = []
release_max_level_warn = []
release_max_level_info = []
release_max_level_debug = []
release_max_level_trace = []

[dependencies]
erased-tracing-attributes = { path = "../erased-tracing-attributes", optional = true }
