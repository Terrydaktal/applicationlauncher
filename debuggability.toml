# Normative contract. docs/DEBUGGABILITY.md is its operator guide, not a second contract.
schema_version = 6
template = false
profile = "stateful"
owner = "Terrydaktal"
expected_failure_modes = ["stalled GUI or IPC", "stale window generations", "failed persistence or recovery", "lost helper", "slow or refused lifecycle update", "native crash", "recorder failure"]

[architecture]
state_owners = ["GUI owns views and selection", "applicationlauncherd owns tracker generations and lifecycle coordination", "independent Python workers own each restart transaction"]
mutation_points = ["tracker Runtime methods", "database transactions and atomic_write", "WindowUpdate staged/verified commit and rollback"]
side_effect_boundaries = ["private same-user D-Bus", "bounded child commands", "private lifecycle requests", "KWin feed", "terminal adapters"]
fault_containment = "Workers execute outside the GUI and daemon executor; original windows are preserved on refused preflight; failed jobs retain private recovery plans."

[errors]
typed_codes = "implemented_tested"
preserves_source_chain = "implemented_tested"
preserves_first_failure = "implemented_tested"
causal_ids = ["process PID/start ticks/boot ID", "operation ID", "event parent and sequence", "window generation", "worker request directory"]

[invariants]
release_checks = ["private same-user regular request files", "PID and start-time revalidation", "verified restart plans before stopping", "launch pair build-ID agreement", "atomic generation publication"]
progress_rules = ["bounded command deadlines", "no-wait operation locks", "bounded retries and backoff", "explicit failed/completed restart states", "45-second ordinary capture deadline"]
resource_balances = ["RAII worker registrations", "bounded event and persistent rings", "bounded worker queue", "capture allocation lease", "staged recovery manifests"]

[configuration]
effective_config = "implemented_tested"
decision_provenance = "implemented_tested"
dynamic_change_history = "implemented_tested"

[build]
identity = "--build-info binds profile, features, exact lock, source inputs and canonical product semantics; --build-id and ELF build ID bind the executable."
exact_artifact_retention = "implemented_tested"
symbols_and_unwind = "implemented_tested"
source_retrieval = "implemented_tested"

[artifacts]
cache_identity = "implemented_tested"
atomic_publication = "implemented_tested"
generation_manifest = "implemented_tested"

[live]
capabilities_command = "--help and --build-info; minimal has identity only, observable also has independent snapshot/capture commands."
snapshot_command = "Observable same-UID diagnostic socket: snapshot; external scripts/capture-release-diagnostics.py --pid PID --output PRIVATE_DIRECTORY works without optional in-process instrumentation."
snapshot_consistency = "best-effort"
independent_of_failure_loop = "implemented_tested"
capture_timeout_ms = 2000

[history]
flight_recorder = "implemented_tested"
schema = "FlightEvent v1 and checksummed ALTRC001 boundary ring; optional history is absent in release-minimal."
capacity_events = 512
drop_and_overwrite_reporting = "implemented_tested"

[audit_trail]
mutation_audit = "not_applicable"
event_schema = "Single-user desktop preferences/history have no authenticated multi-actor business-audit requirement. Required restart recovery records are retained separately."
actor_writer_and_reason = "No independent tenant or business actor; the same local UID controls the launcher and its private service."
attribution_policy = "No claim of historical actor attribution from optional events."
transaction_binding = "SQLite transactions and restart manifests remain product correctness mechanisms, not an asserted durable audit trail."
attempted_write_policy = "Recovery failures retain attempted operation and original typed cause, independently of optional tracing."
provenance_and_deduplication = "Recovery operation identity is product evidence; no generic mutation-audit stream is asserted."
change_representation = "Recovery plans retain required pre-replacement application state, not a general before/after database audit."
direct_write_coverage = "not_applicable"
tamper_evidence = "Same-UID editable local state has no independent tamper-resistance guarantee."
retention_and_access = "Private recovery plans are not pruned by diagnostic retention. Terminal updates retain images through open descriptors only, never copies or hashes; metadata cannot recover an unlinked executable after its last holder exits. Existing binary caches are untouched."
query_and_export = "Recovery plans and progress/result JSON remain directly readable."
sink_failure_policy = "Required recovery publication failure refuses replacement; optional recorder failure never authorizes replacement."
cost_and_backpressure = "Bounded product recovery metadata and file/process/session identity checks remain in every artifact. Neither terminal-update path copies or hashes executables or hashes restart scope."
assurance_test = "tests/test_lifecycle_windows.py and tests/test_lifecycle_recovery_builds.py preserve required recovery state in either generated mode."
max_event_bytes = 0
max_added_commit_p99_ms = 0.0
max_throughput_regression_percent = 0.0
max_audit_wait_ms = 0
max_storage_bytes_per_day = 0

[concurrency]
task_registry = "implemented_tested"
lock_wait_introspection = "implemented_untested"
cross_process_correlation = "implemented_tested"

[resources]
ownership_reporting = "implemented_tested"
declared_budgets = ["512 events and 64 named workers per process", "1000 admitted events/second per process", "2 MiB persistent ring per component", "64 MiB persistent writes per recorder lifetime", "1 MiB semantic snapshot", "32 MiB ordinary bundle", "8 completed/unfinished captures; completed captures expire after seven days on collection"]
high_water_reporting = "implemented_tested"

[reproduction]
recorded_inputs = ["versioned redacted boundary summaries", "required private restart plan and progress journals", "exact compiled source/feature/lock manifests"]
replay_command = "Observable: applicationlauncher replay RING_OR_BUNDLE; deterministic reducer replay is not replay of the OS, GPU or thread schedule."
fault_injection = ["diagnostic-build only: window-feed-drop/duplicate", "terminal-send-failure", "tracker-write-busy", "diagnostic-response-delay", "contained panic/native-crash/blocked-main-loop probes"]

[postmortem]
crash_capture = "implemented_tested"
includes_history = "implemented_tested"
oom_or_external_kill_detection = "implemented_untested"
retention_policy = "Exact binaries/symbols/sources: three builds/component plus running and published-profile build IDs. Automatic ordinary bundles: eight captures, seven-day completed-bundle expiry. Explicit external capture destinations remain caller-managed."

[recovery]
pre_repair_evidence = "implemented_tested"
restart_or_fallback_history = "implemented_tested"
last_failure_retention = "implemented_tested"

[domain]
state_dump = "Best-effort component identity, effective diagnostics/categories, tracker/GUI/app/attention/feed gauges and high waters, named worker wait states, semantic transitions, ring loss and sink health; detailed frame/wheel statistics only during authorized capture."
cross_boundary_ids = ["daemon and GUI build IDs", "PID/start/boot identity", "window/feed generations", "restart operation and parent span IDs"]

[security]
authorization = "Private 0700 directories and 0600 files; same-UID socket peer validation; debugger authorization is exact-peer-PID and expires in 60 seconds; explicit cores are sensitive."
redaction = ["no environment or file contents in ordinary capture", "credential-bearing lines/fields redacted", "bounded scalar timing labels; no titles, prompts, argv or payloads", "external GDB uses no locals or frame arguments"]
max_bundle_bytes = 33554432
retention_days = 7

[budgets]
measurement_status = "implemented_untested"
steady_cpu_percent = 0.25
steady_memory_bytes = 1048576
activated_cpu_percent = 10.0

[deployment_modes]
minimal_release = "scripts/build-release-matrix: release-minimal; optional Rust modules/macros, Python observers and transitive log/tracing runtime are erased."
observable_release = "Default Cargo features and installed target/release pair remain release-observable."
global_runtime_switch = "Observable only: APPLICATIONLAUNCHER_DIAGNOSTICS=off (legacy value minimal is an alias, not an erased artifact)."
per_category_switches = ["Observable startup allow-list APPLICATIONLAUNCHER_DIAGNOSTIC_CATEGORIES=baseline,stderr,update-timings; empty disables all categories", "LifecycleTiming1 ActivateUpdateTimings(seconds) enables only new update jobs for at most 300 seconds"]
diagnostic_builds = ["diagnostic-build feature, same production optimization; only this artifact contains fault-injection hooks and synthetic probes"]
optional_diagnostics_default_enabled = false
lazy_buffer_allocation = true
lazy_helper_start = true

[performance_isolation]
preserves_release_optimization = true
compile_time_exclusion_supported = true
critical_hot_paths = ["search ranking and title projection", "native-build equality", "GUI rows/tiles", "audio samples", "Python restart boundaries"]
disabled_hot_path_extra_instructions = 0
baseline_comparison = "Relocation-normalized optimized search/projection/build-comparison instructions; generated pre-observer Python boundary. Historical whole-GUI non-inferiority is not established by these scoped checks."
minimal_mode_test = "Negative workspace compilation with optional modules absent; actual stripped ELF symbol/string/dependency and embedded Python AST/bytecode checks."
runtime_disabled_test = "Lazy observer argument tests and packaged private-daemon off-mode trials."
always_on_test = "Packaged private-daemon idle CPU/RSS and startup trials; recorder contention/rate/output tests."
activated_mode_tests = ["tests/benchmark_lifecycle_timing.py", "tests/test_lifecycle_timing.py", "diagnostic-build blocked-main-loop capture integration test"]

[artifact_isolation]
single_semantic_source = true
release_minimal_erasure = "implemented_tested"
release_minimal_runtime_diagnostic_checks = 0
semantic_source_and_generation = "Authoritative src plus cfg/token erasure; build-support/lifecycle_sources.py erases observer AST nodes; pinned dependency observer adapters have no surviving linked runtime. No alternate product algorithms."
performance_closure = ["whole GUI and daemon linked runtime: no optional recorder/log/tracing symbols or forbidden markers", "designated optimized search/projection/native comparison instructions", "embedded Python restart modules including runner error paths"]
assurance_artifacts = ["target/release-profiles/diagnostic-build: verified GUI and daemon ELF IDs/SHA256, source, semantics and actual feature inventories"]
release_minimal_postimages = ["target/release-profiles/release-minimal/verification.json: exact GUI/daemon ELF IDs and hashes, embedded Python digests and dependency proof"]
permitted_release_facilities = ["private DWARF/unwind data and build IDs", "immutable identity/provenance manifests and identity-only CLI", "external capture tools, not linked helpers", "required recovery journals/status/errors and safety checks", "product scheduling clocks, operation IDs and renderer/backend behavior"]
forbidden_release_markers = ["own observability/diagnostic_capture/replay symbols", "tracing/tracing_core/log runtime symbols", "MAX_LOG_LEVEL_FILTER", "ALTRC001", "APPLICATIONLAUNCHER_DIAGNOSTICS", "lifecycle_timing", "ActivateUpdateTimings", "fault-injection environment keys"]
postimage_absence_test = "tests/verify_release_artifact.py on the packaged GUI and daemon, not a source-only feature check."
runtime_check_absence_test = "Absent-module negative build, undefined-observer-token compile test, actual linked symbol/marker inspection and designated machine-code comparison."
dependency_absence_test = "tests/verify_release_artifact.py compares resolved product dependencies, verifies generation adapters and rejects tracing-core; linked observer symbols must be zero."
semantic_equivalence_test = "Canonical pre-observer Rust and Python digests across all profiles, same product tests, and identical typed malformed-request outcome from packaged workers."
artifact_provenance_test = "Hash-verified compile-input/source archives, actual generated lock, exact ELF/split-symbol/native-library checksums and archive-only source-frame recovery."

[instrumentation_policy]
facility_admission = "required"
default_class = "activated"
max_steady_cpu_percent = 0.25
max_steady_memory_bytes = 1048576
max_event_rate_per_second = 1000
max_disk_bytes_per_day = 67108864 # Per recorder process; lifetime cap is stronger than its daily cap.
max_snapshot_pause_ms = 100
max_activation_ttl_seconds = 300
max_activated_capture_bytes = 33554432
max_minimal_cpu_regression_percent = 0.0
max_runtime_disabled_cpu_regression_percent = 0.1
max_steady_p99_latency_regression_percent = 1.0
max_activated_cpu_percent = 10.0
synchronous_hot_path_io = false
global_contended_event_index = false
require_overhead_test = true
promotion_requires_measurement = true

[assurance]
contract_test = "tests/test_debuggability_contract.py plus the skill schema-version-6 strict validator."
synthetic_scenarios = ["private malformed lifecycle request", "contained diagnostic panic/native crash and blocked-main-loop capture", "ring wrap/loss and output failure", "archive-only source recovery", "healthy private daemon negative control"]
symbolization_test = "tests/verify_release_diagnosis.py uses archived stripped executable, split symbols, exact source and native modules in an isolated startup-core fixture."
redaction_test = "src/observability.rs and src/diagnostic_capture.rs unit tests; tests/test_lifecycle_timing.py and tests/test_release_diagnostics.py."
overhead_test = "tests/verify_performance_closure.py, tests/verify_release_diagnosis.py, tests/benchmark_lifecycle_timing.py; scope and unexecuted GUI/historical measurements remain explicit."
snapshot_test = "Contended recorder tests, exact-PID packaged-daemon snapshot trials and diagnostic-build main-loop-blocked integration test."

[exceptions]
items = [
  {control="audit_trail.mutation_audit", disposition="not_applicable", reason="Local single-UID desktop preferences and recoverable history require integrity/recovery, not independent historical actor accountability; required restart plans remain product behavior."},
  {control="audit_trail.direct_write_coverage", disposition="not_applicable", reason="No required generic durable audit stream is claimed for the single-UID local store; required restart publication and database transactions remain enforced."},
]

